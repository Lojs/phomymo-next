server {
    listen 80;
    server_name ${PHOMYMO_DOMAIN} _;
    # Bluetooth/USB printing only works in a secure context, so send everything to HTTPS.
    #
    # PHOMYMO_REDIRECT_PORT is set by the entrypoint from PHOMYMO_HTTPS_PORT and is empty when HTTPS is
    # published on 443. $host carries no port, so http://ip:8444 used to redirect to https://ip/ — a
    # port nothing listens on, which reads as the site being down.
    location / {
        return 301 https://$host${PHOMYMO_REDIRECT_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PHOMYMO_DOMAIN} _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The raster is generated in the browser and never leaves the device, and there are no accounts
    # or server-side state, so the policy can be strict. 'unsafe-inline' is needed for styles because
    # React writes inline style attributes for element positions; scripts do not need it.
    # 'wasm-unsafe-eval' is needed by the PDF and QR libraries, which compile wasm.
    #
    # NOTE: nginx's add_header does not inherit into a location block that has its own add_header, so
    # these are repeated per location below rather than set once at server level.
    include /etc/nginx/snippets/phomymo-security-headers.conf;

    # Fonts and hashed assets are immutable (Vite fingerprints the filename).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/phomymo-security-headers.conf;
        try_files $uri =404;
    }

    # The service worker must never be cached, or a stale one pins an old app indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/phomymo-security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/phomymo-security-headers.conf;
        try_files $uri =404;
    }

    # Single-page app: extension-less paths fall back to index.html.
    # Missing files with an extension (e.g. /favicon.ico) return 404, not the app shell.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/phomymo-security-headers.conf;
        try_files $uri @spa-fallback;
    }

    location @spa-fallback {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/phomymo-security-headers.conf;
        # Only fall back for extension-less paths (SPA routes).
        if ($request_uri !~ \.[a-z0-9]+$) {
            rewrite ^ /index.html last;
        }
        return 404;
    }

    gzip on;
    # text/javascript is what nginx actually receives for a Vite .js bundle; without it the main
    # bundle (~450KB) was served uncompressed. gzip_proxied is irrelevant here but harmless.
    # font/woff2 is already compressed and omitted; application/manifest+json added.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;
}