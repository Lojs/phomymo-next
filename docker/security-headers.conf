# Security headers, kept in one file because nginx's add_header does not inherit into a location
# block that defines its own — so every location has to include this rather than relying on the
# server-level copy.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# usb and bluetooth are the two capabilities this app actually needs, and only for itself.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(self), bluetooth=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
# HSTS is opt-in because browsers ignore it on self-signed certificates and it cannot be
# undone once cached. To enable, set PHOMYMO_HSTS=1 in the environment and add:
#   add_header Strict-Transport-Security "max-age=31536000" always;
# to this file (or a location block) manually.
