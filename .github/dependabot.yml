# Keeps the pinned GitHub Actions current.
#
# The workflow pins every action to a commit SHA, which is what makes it trustworthy: a tag like
# `actions/checkout@v4` is a mutable reference its owner can repoint at any time, so pinning the tag
# says nothing about which code actually ran. The cost of pinning is that a SHA never moves on its
# own, so without this the workflow would run a stale action indefinitely — and the v1.0.18 review
# noted that build-push-action's pinned SHA was from May 2024.
#
# Dependabot proposes the bump; it never applies it, so the pin stays a deliberate act.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    labels: [dependencies]
  # A new dependency or a bumped range can change what the build produces, so the image is rebuilt
  # and the suite re-run rather than only being checked.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    labels: [dependencies]
