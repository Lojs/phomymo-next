name: Build and publish Docker image

# يشتغل هذا تلقائيًا كل ما ترفع تعديل لفرع main، أو تسوي إصدار (tag) جديد،
# أو تضغط "Run workflow" يدويًا من تبويب Actions بأعلى الصفحة.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The gate. The image is a published artefact that the Pi pulls automatically, so publishing code
  # that has not passed typecheck and the tests means shipping a broken release to a live printer.
  # This job used to live in a separate workflow (Tests), which did nothing to stop this one: both
  # ran on the same push, independently, and the image was pushed whether or not the tests passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: تجهيز Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: تثبيت التبعيات
        run: npm ci

      # tests/nginx-runtime.test.ts starts a real nginx and skips itself when there is none.
      - name: تثبيت nginx لاختبار الإعدادات
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nginx-light

      # The About dialog shows the version baked in from package.json (vite.config.ts), so a tag
      # whose number disagrees with package.json ships a UI that misreports what it is. Tagging
      # is a manual step, which is exactly why it needs a gate.
      - name: الوسم يطابق إصدار package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # عبر env، لا عبر ${{ }} داخل run: — اسم الوسم نص يختاره من يملك حق الدفع،
          # وتوسيع قيم السياق داخل السكربت هو ما توصي به GitHub نفسه.
          REF_NAME: ${{ github.ref_name }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          got="$REF_NAME"
          if [ "$want" != "$got" ]; then
            echo "::error::Tag $got does not match package.json version ($want)"
            exit 1
          fi
          echo "Tag $got matches package.json."

      - name: التحقق من الأنواع
        run: npm run typecheck

      - name: تشغيل الاختبارات مع تغطية
        run: npm run test:ci

      - name: بناء الإنتاج
        run: npm run build

  build-and-push:
    # Nothing is published unless verify passed. This is the line that was missing.
    needs: verify
    # Pull requests are verified but never published: they run code from a fork or an unmerged
    # branch, and a sha-… image tag would put that code on the registry this app is deployed from.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: تسجيل الدخول إلى GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: تجهيز أسماء وعلامات الصورة
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Only needed for the arm64 runtime stage now that the Node build stage runs on the native
      # builder (see the Dockerfile's --platform=$BUILDPLATFORM). QEMU is still set up because the
      # nginx layer is still cross-built, but the slow part no longer runs under emulation.
      - name: تجهيز QEMU (لدعم بناء ARM64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: تجهيز Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: بناء الصورة ورفعها
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max