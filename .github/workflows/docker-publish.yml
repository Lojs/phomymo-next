name: Build and publish Docker image

# يشتغل هذا تلقائيًا كل ما ترفع تعديل لفرع main، أو تسوي إصدار (tag) جديد،
# أو تضغط "Run workflow" يدويًا من تبويب Actions بأعلى الصفحة.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The gate. The image is a published artefact that the Pi pulls automatically, so publishing code
  # that has not passed typecheck and the tests means shipping a broken release to a live printer.
  # This job used to live in a separate workflow (Tests), which did nothing to stop this one: both
  # ran on the same push, independently, and the image was pushed whether or not the tests passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: تثبيت التبعيات
        run: npm ci

      - name: التحقق من الأنواع
        run: npm run typecheck

      - name: تشغيل الاختبارات مع تغطية
        run: npm run test:ci

      - name: بناء الإنتاج
        run: npm run build

  build-and-push:
    # Nothing is published unless verify passed. This is the line that was missing.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تسجيل الدخول إلى GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: تجهيز أسماء وعلامات الصورة
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Only needed for the arm64 runtime stage now that the Node build stage runs on the native
      # builder (see the Dockerfile's --platform=$BUILDPLATFORM). QEMU is still set up because the
      # nginx layer is still cross-built, but the slow part no longer runs under emulation.
      - name: تجهيز QEMU (لدعم بناء ARM64)
        uses: docker/setup-qemu-action@v3

      - name: تجهيز Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: بناء الصورة ورفعها
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max