name: Tests

# يشتغل تلقائيًا على كل رفع لفرع main وعلى كل طلب دمج.
# الهدف: لا يُدمج أو يُنشر كود إلا بعد نجاح الاختبارات والتحقق من الأنواع.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: تثبيت التبعيات
        run: npm ci

      - name: التحقق من الأنواع
        run: npm run typecheck

      - name: تشغيل الاختبارات
        run: npm test

      - name: بناء الإنتاج
        run: npm run build
