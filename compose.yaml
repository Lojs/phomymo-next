# Phomymo Next — label designer for a Phomemo thermal printer.
# Rebuilt 2026-09-29 and written to house style.
# Secrets live in ./.env — keep that file private.
services:
  phomymo-next:
    image: ghcr.io/lojs/phomymo-next:latest
    container_name: "phomymo-next"
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8444:443
    volumes:
      - ./phomymo-certs:/certs
    env_file:
      - .env
    environment:
      - TZ=UTC

volumes:
  phomymo-certs:
