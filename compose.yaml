services:
  phomymo-next:
    image: ghcr.io/lojs/phomymo-next:latest
    build: .
    container_name: "phomymo-next"
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8444:443"
    volumes:
      - ./phomymo-certs:/certs
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=UTC
    read_only: true
    # nginx binds 443, creates its own temp dirs, and drops its workers to the unprivileged
    # nginx user — so it needs these five back after everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Writable scratch for a read-only root.
    tmpfs:
      - /var/cache/nginx:size=10m
      - /var/run:size=1m
      - /etc/nginx/conf.d:size=1m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'