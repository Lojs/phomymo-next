services:
  phomymo-next:
    image: ghcr.io/lojs/phomymo-next:latest
    build: .
    container_name: "phomymo-next"
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8444:443"
    volumes:
      # Certs must persist across restarts. The entrypoint generates a self-signed certificate on
      # first run and writes a marker beside it — the domain and a fingerprint — so that a
      # certificate the user supplied is never regenerated over. On a tmpfs the marker would vanish
      # with it, and every restart would issue a certificate no browser has trusted, which presents
      # as a hijack warning rather than as a changed file.
      - ./phomymo-certs:/certs
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=UTC
    read_only: true
    # nginx binds 443, chowns its temp dirs, drops its workers to the unprivileged nginx user, and
    # writes the rendered config itself, so these five are added back after everything else is
    # dropped. DAC_OVERRIDE is the one that is easy to leave out and hard to explain: the master is
    # root, but with cap_drop ALL its privileges are exactly this list, and a root without
    # DAC_OVERRIDE cannot write a path it does not own — the certificate directory, when the bind
    # mount was created on the host and is owned by the host user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Writable scratch for a read-only root: nginx's temp paths and its pid file, and conf.d, because
    # the entrypoint renders the config into /etc/nginx/conf.d/default.conf at startup.
    #
    # conf.d is a tmpfs, which is the part that matters if this is ever "simplified": a tmpfs starts
    # empty, so anything the image put there is hidden the moment it is mounted — including the stock
    # default.conf — and the only config nginx sees is the one the entrypoint writes. Keeping the
    # template in /usr/share/phomymo/ is what makes that safe: a file in conf.d is at the mercy of
    # that mount. (nginx's include line is conf.d/*.conf, so a .template file would not be loaded
    # anyway — but relying on that is relying on the filename, not on the mount.)
    tmpfs:
      - /var/cache/nginx:size=10m
      - /var/run:size=1m
      - /etc/nginx/conf.d:size=1m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'